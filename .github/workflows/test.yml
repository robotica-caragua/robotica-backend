name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only-root-password
          MARIADB_DATABASE: robotica_test
          MARIADB_USER: robotica_test
          MARIADB_PASSWORD: test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://robotica_test:test-only-password@127.0.0.1:3306/robotica_test
      TEST_DATABASE_URL: mysql://robotica_test:test-only-password@127.0.0.1:3306/robotica_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run test:db
